
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .top-logo {
    position: absolute;
    top: 20px;
    left: 20px;
}

.top-logo img {
    width: 40px;
    height: 40px;
    object-fit: contain;
}

        .profile-card {
            width: 380px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* Header */
        .header {
            background: #103b50;
            color: white;
            text-align: center;
            padding: 10px 20px;
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            color: #102b50;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px;
            font-size: 30px;
            font-weight: bold;
        }

        .header h1 {
            font-size: 25px;
         
        }

        .occupation {
            color: #cbd9ed;
            font-size: 15px;
        }

        .company {
            margin-top: 8px;
            font-size: 14px;
            color: #ffffff;
        }

        /* Profile information */
        .details {
            padding: 25px;
        }

        .detail {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #eeeeee;
        }

        .detail:last-child {
            border-bottom: none;
        }

        .icon {
            width: 40px;
            height: 40px;
            background: #eaf0f8;
            color: #102b50;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .detail-info {
            flex: 1;
        }

        .detail-info h3 {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 5px;
        }

        .detail-info p,
        .detail-info a {
            font-size: 14px;
            color: #102b50;
            text-decoration: none;
            word-break: break-word;
        }

        .detail-info a:hover {
            color: #2563eb;
        }


        .footer {
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #64748b;
            background: #f8fafc;
        }

    </style>
</head>

<body>

    <div class="profile-card">

        <!-- Profile Header -->
        <div class="header">

            <div class="header h1" width="80px" height="80px">
                <h1>
             <img src="logo.png" alt="Company Logo">
             </h1>
            </div>

            <div class="logo">
                <img src="LM.jpg" width="80px" height="80px"/>
            </div>

            <h1>Lerato Matsaneng</h1>

            <p class="occupation">
                Chief Operating Officer 
            </p>

            <p class="company">
                AN Technologies
            </p>

        </div>

        <!-- Profile Details -->
        <div class="details">

            <!-- Phone -->
            <div class="detail">
                <div class="icon">📞</div>

                <div class="detail-info">
                    <h3>Phone Number</h3>
                    <p>+27 60 5777 833</p>
                </div>
            </div>

            <!-- Email -->
            <div class="detail">
                <div class="icon">✉</div>

                <div class="detail-info">
                    <h3>Email</h3>
                    <a href="mailto:john.doe@example.com">
                       lerato@antech.dev 
                    </a>
                </div>
            </div>

            <!-- LinkedIn -->
            <div class="detail">
                <div class="icon">@</div>

                <div class="detail-info">
                    <h3>Website</h3>
                
                    <a href="www.antech.dev"
                       target="_blank">
                        www.antech.dev
                    </a>
                </div>
            </div>

            <!-- Address -->
            <div class="detail">
                <div class="icon">📍</div>

                <div class="detail-info">
                    <h3>Address</h3>
                    <p>Suite 6,8th floor,Metal Box,25 Owl Street,Braamfontein Werf,Johannesburg,South Africa</p>
                </div>
            </div>

            <!-- Company -->
            <div class="detail">
                <div class="icon">🏢</div>

                <div class="detail-info">
                    <h3>Our Project</h3>
                    <p>AN Technologies</p>
                </div>
            </div>

        </div>

        <div class="footer">
            Business Profile
        </div>

    </div>

</body>
</html>
